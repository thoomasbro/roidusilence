name: Vérifier et publier sur GitHub Pages

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exécuter les tests
        run: npm test

      - name: Construire le site
        run: npm run build

      - name: Préparer GitHub Pages
        if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
        uses: actions/configure-pages@v5

      - name: Archiver le site
        if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publication:
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
    needs: verification
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
